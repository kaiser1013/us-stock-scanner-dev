name: Scanner Tests

on:

    push:

    pull_request:

    workflow_dispatch:

jobs:

    test:

        runs-on: ubuntu-latest

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
            with:
                python-version: "3.12"

            - uses: Install Dependencies
            run: |
                pip install -r requirements.txt
                pip install pytest

            - name: Run Tests
            run: |
                pytest test/
            