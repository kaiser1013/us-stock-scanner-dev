name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          pip install \
            pytest \
            pytest-cov \
            mypy \
            ruff

      - name: Lint
        run: |
          ruff check .

      - name: Type Check
        run: |
          mypy scanner

      - name: Unit Tests
        run: |
          pytest tests -v

      - name: Ruff
        run: |
          ruff check .

      - name: MyPy
        run: |
          mypy scanner

      - name: Tests
        run: |
          pytest -v

      - name: Coverage
        run: |
          pytest tests \
            --cov=scanner \
            --cov-report=term-missing \
            --cov-fail-under=80
